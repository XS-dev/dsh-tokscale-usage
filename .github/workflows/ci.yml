name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check index.mjs
          node --check client.js
          node --check lib/tokscale.mjs
          node --check lib/store.mjs
          node --check lib/tasks.mjs
          node --check lib/views.mjs
          node --check lib/sources.mjs
      - name: Unit tests
        run: npm test
